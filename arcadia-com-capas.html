<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcádia</title>
<style>
:root{--bg:#0d0905;--card:#16100a;--bd:#2c2216;--tx:#f4efe8;--mut:#9a8d7c;--or:#ffa60a;--or2:#7a4f08;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:"Outfit","Segoe UI",system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#0d0905cc;backdrop-filter:blur(8px)}
.logo{font-weight:800;font-size:13px;letter-spacing:.5px}.logo b{color:var(--or)}
.top input{width:230px;max-width:50vw;background:#1a130b;border:1px solid var(--bd);border-radius:8px;padding:7px 12px;color:var(--tx);font-size:12px}
.hero{position:relative;margin-top:-44px;padding:150px 24px 30px;background:radial-gradient(ellipse at 50% -10%,#b8821e88,transparent 55%),linear-gradient(#1a2a28,var(--bg))}
.wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}.hb{position:absolute;left:0;top:0;width:100%;height:460px;object-fit:cover;opacity:.6;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}.shots img{display:block;width:100%;height:100%;object-fit:cover;border-radius:6px}.hero{overflow:hidden}
.badge{display:inline-block;background:var(--or);color:#1a1000;font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px}
.hero h1{font-size:34px;margin:8px 0 4px}.hero p{color:#cbb98f;font-size:12px;max-width:340px;line-height:1.5}
.btn{background:var(--or);color:#1a1000;font-weight:700;font-size:12px;padding:9px 16px;border-radius:8px;margin-top:14px}
.btn:hover{filter:brightness(1.1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 20px}
.stat{background:#120d08cc;border:1px solid var(--bd);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center}
.stat i{font-style:normal;color:var(--or);background:#2a1d0a;border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
.stat b{font-size:20px;display:block}.stat span{font-size:9px;color:var(--mut);letter-spacing:.5px}
.bar{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#1d150c;border:1px solid var(--bd);font-size:10px;padding:5px 10px;border-radius:99px;color:#d8cdbb}
.chip.on{background:var(--or);color:#1a1000;border-color:var(--or);font-weight:700}
select{background:#1a130b;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px 14px;padding-bottom:50px}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}.stats{gap:8px}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.bar{flex-direction:column}.hero h1{font-size:26px}.stat{padding:10px;flex-direction:column;align-items:flex-start}}
.g{text-align:left;display:block;transition:transform .2s}.g:hover{transform:translateY(-4px)}
.cv{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;box-shadow:0 6px 18px #0008}
.cv span{font-family:Georgia,"Times New Roman",serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;line-height:1.15;text-shadow:0 2px 10px #000a;font-size:var(--fs,15px);position:relative}
.cv:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#ffffff30,transparent 55%)}
.cv:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,#0000 0 14px,#ffffff08 14px 15px)}
.rt{position:absolute;top:4px;right:4px;z-index:2;background:#000b;color:var(--or);font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px}
.g h3{font-size:10px;margin:7px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g small{display:flex;justify-content:space-between;font-size:8px;color:var(--mut)}
.st{color:var(--or);letter-spacing:1px}.st u{text-decoration:none;color:#4a3d2a}
.det{max-width:700px;margin:0 auto;padding:60px 16px 60px;position:relative}
.dbg{position:absolute;left:0;right:0;top:0;height:260px;z-index:-1}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;z-index:6;background:#000a;font-size:11px;padding:6px 10px;border-radius:8px}
.dg{display:grid;grid-template-columns:150px 1fr;gap:25px;margin-top:20px}
@media(max-width:600px){.dg{grid-template-columns:1fr}.dg .cv{max-width:170px}}
.dg .cv{border-radius:8px;box-shadow:0 0 30px #ffa60a33}
.info{font-size:9px;margin-top:12px}.info div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}.info span{color:var(--mut)}
.play{width:100%;background:var(--or);color:#1a1000;font-weight:700;font-size:10px;padding:11px;border-radius:7px;margin-top:10px}
.dt h1{font-size:28px}.dt>p{font-size:10px;color:#b8a77f;margin:4px 0 14px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}.shots div{aspect-ratio:16/9;border-radius:6px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.sum{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.big{font-size:42px;font-weight:800;color:var(--or);line-height:1}
.dist{flex:1;min-width:160px;font-size:8px}.dist b{font-size:10px;display:block;margin-bottom:4px}
.dr{display:flex;align-items:center;gap:8px;margin:3px 0}.dr em{font-style:normal;width:8px}.dr i{flex:1;height:4px;background:#2a2118;border-radius:9px;overflow:hidden}.dr i s{display:block;height:100%;background:var(--or)}.dr span{width:8px;color:var(--mut)}
.sim{background:#241b11;font-size:9px;padding:8px 10px;border-radius:7px}
.yr{font-size:10px;font-weight:700;margin:16px 0 8px}
.pick button{font-size:20px;color:#6b5a40;padding:0 2px}.pick button.on{color:var(--or)}
textarea{width:100%;height:56px;margin-top:8px;background:#0f0a05;border:1px solid var(--bd);border-radius:7px;padding:8px;color:var(--tx);font:inherit;font-size:10px;resize:vertical}
.pub{background:var(--or2);color:#f5deb0;font-size:9px;font-weight:700;padding:7px 12px;border-radius:6px;margin-top:10px}.pub.ok{background:var(--or);color:#1a1000}
.rv{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:10px}
.rv.me{border-color:var(--or);background:#1d1407}
.rh{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700}.rh .av{width:20px;height:20px;border-radius:50%;background:#2a2118;display:grid;place-items:center;font-size:8px}.rh time{margin-left:auto;color:var(--mut);font-weight:400;font-size:8px}
.rv p{font-size:9px;color:#c9bca6;margin-top:8px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);background:var(--or);color:#1a1000;font-weight:700;font-size:12px;padding:10px 16px;border-radius:9px;z-index:9}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:40px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D={RPG:"Um RPG vasto, com escolhas que moldam sua jornada.",Soulslike:"Desafio implacável, combates precisos e vitórias memoráveis.",Ação:"Ação intensa do primeiro ao último minuto.",FPS:"Tiroteio tático em primeira pessoa, onde cada segundo conta.",MOBA:"Estratégia em equipe e partidas competitivas.",Simulação:"Planeje, construa e relaxe no seu próprio ritmo.",Metroidvania:"Explore um mundo interconectado cheio de segredos.",Roguelike:"Cada partida é diferente, cada morte ensina algo novo.",Sandbox:"Liberdade total para criar e explorar.",Sobrevivência:"Colete, construa e sobreviva a um mundo hostil.","Battle Royale":"Seja o último de pé em partidas frenéticas.",Terror:"Tensão constante e sustos que ficam na memória."};
const ID=[1245620, 1145360, 489830, 892970, 1144200, 1091500, 578080, 1593500, 646570, 1086940, 367520, 252490, 990080, 588650, 2050650, 1817070, 292030, 1174180, 814380, 413150, 1172470, 374320, 570, 271590, 105600, 730, 1693980, 550, 242760, 0, 0, 268910, 387290, 632470, 526870, 255710, 1627720, 632360, 739630, 214490, 774361];
const HOSTS=["https://cdn.cloudflare.steamstatic.com/steam/apps/","https://cdn.akamai.steamstatic.com/steam/apps/","https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/"];
function nx(e){const l=JSON.parse(e.dataset.c),i=+e.dataset.i+1;if(i<l.length){e.dataset.i=i;e.src=l[i]}else e.remove()}
function im(g,f,loc,st,cl){const l=[];if(g.id)for(const x of f)for(const h of HOSTS)l.push(h+g.id+"/"+x);if(loc)l.push(loc);if(!l.length)return"";return`<img class="${cl||""}" alt="" referrerpolicy="no-referrer" data-c='${JSON.stringify(l)}' data-i="0" src="${l[0]}" onerror="nx(this)" style="${st||""}">`}
const ST=(id,f)=>`https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/${f}`;
const L=[
["Elden Ring","Soulslike,RPG,Ação","FromSoftware",2022,210,229.9,4.9,35,"Levante-se, Maculado, e seja guiado pela graça para portar o poder do Anel Prístino."],
["Hades","Roguelike,Ação","Supergiant Games",2020,88,73.99,4.8,5],
["Skyrim Special Edition","RPG","Bethesda",2016,260,99.9,4.7,200],
["Valheim","Sobrevivência,Sandbox","Iron Gate",2021,145,46.99,4.6,150],
["Ready or Not","FPS,Ação","VOID Interactive",2023,49,99.99,4.3,0],
["Cyberpunk 2077","RPG,Ação","CD Projekt RED",2020,142,199.9,4.3,55],
["PUBG: Battlegrounds","Battle Royale,FPS","Krafton",2017,377,0,4.1,40],
["God of War","Ação,RPG","Santa Monica Studio",2018,54,129.9,4.1,10],
["Slay the Spire","Roguelike","Mega Crit",2019,133,45.99,4.1,20],
["Baldur’s Gate 3","RPG","Larian Studios",2023,75,199.9,4.1,270],
["Hollow Knight","Metroidvania,Soulslike","Team Cherry",2017,64,46.99,4.1,215],
["Rust","Sobrevivência,Sandbox","Facepunch",2018,540,129.99,4.1,15],
["Hogwarts Legacy","RPG,Ação","Avalanche",2023,67,249.9,3.8,230],
["Dead Cells","Roguelike,Metroidvania","Motion Twin",2018,39,46.99,3.8,340],
["Resident Evil 4","Terror,Ação","Capcom",2023,19,249.9,3.8,0],
["Spider-Man Remastered","Ação","Insomniac",2022,47,249.9,3.8,350],
["The Witcher 3","RPG","CD Projekt RED",2015,168,79.99,3.7,180],
["Red Dead Redemption 2","Ação,Sandbox","Rockstar",2019,94,249.9,3.7,25],
["Sekiro","Soulslike,Ação","FromSoftware",2019,71,229.9,3.6,30],
["Stardew Valley","Simulação,RPG","ConcernedApe",2016,230,24.99,3.6,100],
["Apex Legends","Battle Royale,FPS","Respawn",2019,288,0,3.5,8],
["Dark Souls III","Soulslike,RPG","FromSoftware",2016,130,129.9,3.4,20],
["Dota 2","MOBA","Valve",2013,860,0,3.4,0],
["Grand Theft Auto V","Ação,Sandbox","Rockstar",2015,320,79.99,3.0,45],
["Terraria","Sandbox,Sobrevivência","Re-Logic",2011,180,21.99,3.4,120],
["Counter-Strike 2","FPS","Valve",2023,520,0,3.2,45],
["Dead Space","Terror,Ação","Motive",2023,18,249.9,4.0,195],
["Left 4 Dead 2","FPS,Terror","Valve",2009,95,32.99,3.9,5],
["The Forest","Sobrevivência,Terror","Endnight",2018,60,36.99,3.7,130],
["League of Legends","MOBA","Riot Games",2009,700,0,3.3,210],
["Fortnite","Battle Royale,Ação","Epic Games",2017,150,0,3.2,280],
["Cuphead","Ação","Studio MDHR",2017,22,36.99,4.0,50],
["Ori and the Blind Forest","Metroidvania","Moon Studios",2015,16,36.99,4.4,175],
["Disco Elysium","RPG","ZA/UM",2019,40,89.99,4.5,15],
["Satisfactory","Simulação,Sobrevivência","Coffee Stain",2024,230,79.99,4.4,28],
["Cities: Skylines","Simulação","Colossal Order",2015,310,64.99,3.9,160],
["Lies of P","Soulslike,Ação","Neowiz",2023,45,199.9,4.2,40],
["Risk of Rain 2","Roguelike,Ação","Hopoo Games",2020,120,36.99,4.1,95],
["Phasmophobia","Terror","Kinetic Games",2020,70,36.99,3.9,260],
["Alien: Isolation","Terror","Creative Assembly",2014,25,79.99,4.0,110],
["Blasphemous","Metroidvania,Soulslike","The Game Kitchen",2019,28,46.99,3.8,350]
].map((a,i)=>({i,id:ID[i],n:a[0],g:a[1].split(","),dev:a[2],y:a[3],h:a[4],p:a[5],r:a[6],hue:a[7],d:a[8]||D[a[1].split(",")[0]],slug:a[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}));
const NM=["CafeComBits","BugHunter","Kaio_BR","LoreMaster","Pixelina","TavernKeeper","GamerDoSul","NoobSlayer"];
const TX={5:["Um dos melhores que já joguei.","Perdi o sono jogando isso. Perfeito.","Obra-prima, sem dúvida.","Vale cada centavo."],4:["Muito bom, recomendo.","Diversão garantida."],3:["Bom, mas poderia ser melhor."],2:["Esperava mais."],1:["Não me prendeu."]};
const OFF=[0,.4,-.4,.6,-.6,.2,-.2,.8];
const seed=g=>{const c=5+g.i%4,o=[];for(let k=0;k<c;k++){const s=Math.max(1,Math.min(5,Math.round(g.r+OFF[k]))),t=TX[s];o.push({n:NM[(k+g.i)%8],s,t:t[(k+g.i)%t.length],d:new Date(2026,(k*3+g.i)%10,1+(k*7+g.i)%28).getTime()})}return o};
let X={};try{X=JSON.parse(localStorage.getItem("arcadia")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("arcadia",JSON.stringify(X))}catch(e){}};
const revs=g=>{const e=X[g.slug]||[];return[...e.slice().reverse(),...seed(g)]};
const avg=g=>{const r=revs(g);return r.reduce((a,b)=>a+b.s,0)/r.length};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars=n=>{n=Math.round(n);return'<span class="st">'+"★".repeat(n)+"<u>"+"★".repeat(5-n)+"</u></span>"};
const cover=g=>{const h=g.hue,w=g.n.length>14?12:g.n.length>9?15:19;return`<div class="cv" style="--fs:${w}px;background:linear-gradient(165deg,hsl(${h} 65% 38%),hsl(${(h+40)%360} 55% 16%) 60%,hsl(${h} 40% 6%))"><span>${esc(g.n)}</span>${im(g,["library_600x900.jpg","library_600x900_2x.jpg"],"capas/"+g.slug+".jpg","position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1")}</div>`};
const fmtH=h=>h>=1000?(h/1000).toFixed(1)+"k":h+"h";
const brl=p=>p?"R$ "+p.toFixed(2).replace(".",","):"Grátis";
let filter="Todos",sort="rate",q="";
const GEN=["Todos","RPG","Soulslike","Ação","FPS","MOBA","Simulação","Metroidvania","Roguelike","Sandbox","Sobrevivência","Battle Royale","Terror"];
const app=document.getElementById("app");
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1800)}

function lib(){
 const f=L[0],tot=L.reduce((a,g)=>a+g.h,0),m=L.reduce((a,g)=>a+avg(g),0)/L.length;
 app.innerHTML=`<div class="top"><div class="logo">🎮 ARC<b>Á</b>DIA</div><input id="q" placeholder="Buscar na biblioteca…" value="${esc(q)}"></div>
 <section class="hero">${im(f,["library_hero.jpg","header.jpg"],"","","hb")}<div class="wrap"><span class="badge">EM DESTAQUE</span><h1>${f.n}</h1><p>${f.d}</p><button class="btn" data-go="${f.slug}">Ver e avaliar</button>
 <div class="stats"><div class="stat"><i>🎮</i><div><b>${L.length}</b><span>JOGOS</span></div></div><div class="stat"><i>⏱</i><div><b>${tot.toLocaleString("pt-BR")}</b><span>HORAS JOGADAS</span></div></div><div class="stat"><i>🏆</i><div><b>${m.toFixed(1).replace(".",",")}</b><span>NOTA MÉDIA</span></div></div></div>
 <div class="bar"><div class="chips">${GEN.map(c=>`<button class="chip${c==filter?" on":""}" data-f="${c}">${c}</button>`).join("")}</div>
 <select id="so"><option value="rate">Melhor avaliados</option><option value="hours">Mais jogados</option><option value="name">Nome (A–Z)</option><option value="year">Mais recentes</option></select></div>
 <div class="grid" id="gr"></div></div></section>`;
 document.getElementById("so").value=sort;grid();
 document.getElementById("q").oninput=e=>{q=e.target.value;grid()};
 document.getElementById("so").onchange=e=>{sort=e.target.value;grid()};
 app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;app.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x==b));grid()});
 app.querySelector("[data-go]").onclick=e=>location.hash=e.currentTarget.dataset.go;
}
function grid(){
 let a=L.filter(g=>(filter=="Todos"||g.g.includes(filter))&&g.n.toLowerCase().includes(q.toLowerCase()));
 const S={rate:(x,y)=>avg(y)-avg(x),hours:(x,y)=>y.h-x.h,name:(x,y)=>x.n.localeCompare(y.n),year:(x,y)=>y.y-x.y};
 a.sort(S[sort]);
 document.getElementById("gr").innerHTML=a.length?a.map(g=>`<button class="g" data-go="${g.slug}"><div style="position:relative">${cover(g)}<span class="rt">${avg(g).toFixed(1)}</span></div><h3>${esc(g.n)}</h3><small>${stars(avg(g))}<span>${fmtH(g.h)}</span></small></button>`).join(""):'<div class="empty">Nenhum jogo encontrado.</div>';
 document.querySelectorAll("#gr [data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
}
function detail(g){
 let pick=0;const h=g.hue;
 const draw=()=>{
  const r=revs(g),a=avg(g),c=[0,0,0,0,0,0];r.forEach(x=>c[x.s]++);
  const lab=a>=4.5?"Extremamente positivas":a>=4?"Muito positivas":a>=3?"Positivas":"Mistas";
  document.getElementById("rb").innerHTML=`<div class="sum"><div><div class="big">${a.toFixed(1).replace(".",",")}</div>${stars(a)}<div style="font-size:8px;color:var(--mut);margin-top:3px">${r.length} avaliações</div></div>
  <div class="dist"><b>${lab}</b>${[5,4,3,2,1].map(n=>`<div class="dr"><em>${n}</em><i><s style="width:${c[n]/r.length*100}%"></s></i><span>${c[n]}</span></div>`).join("")}</div>
  <button class="sim" id="sim">✨ Simular avaliações</button></div>
  <div class="yr">Sua avaliação</div><div class="pick" id="pk">${[1,2,3,4,5].map(n=>`<button data-s="${n}" class="${n<=pick?"on":""}">${n<=pick?"★":"☆"}</button>`).join("")}</div>
  <textarea id="tx" placeholder="O que achou do jogo?"></textarea><button class="pub${pick?" ok":""}" id="pb">Publicar avaliação</button>`;
  document.getElementById("rl").innerHTML=r.map(x=>`<div class="rv${x.me?" me":""}"><div class="rh"><span class="av">${esc(x.n[0])}</span>${esc(x.n)} ${stars(x.s)}<time>${new Date(x.d).toLocaleDateString("pt-BR")}</time></div><p>${esc(x.t)}</p></div>`).join("");
  document.querySelectorAll("#pk button").forEach(b=>b.onclick=()=>{const t=document.getElementById("tx").value;pick=+b.dataset.s;draw();document.getElementById("tx").value=t});
  document.getElementById("pb").onclick=()=>{
   const t=document.getElementById("tx").value.trim();
   if(!pick)return toast("Escolha uma nota de 1 a 5 estrelas");
   const e=(X[g.slug]||[]).filter(x=>!x.me);e.push({n:"Você",s:pick,t:t||"Sem comentário.",d:Date.now(),me:1});X[g.slug]=e;save();pick=0;draw();toast("Avaliação publicada!")};
  document.getElementById("sim").onclick=()=>{
   const e=X[g.slug]||[];for(let k=0;k<3;k++){const s=Math.max(1,Math.min(5,Math.round(g.r+(Math.random()*2-1)))),t=TX[s];e.push({n:NM[Math.floor(Math.random()*8)],s,t:t[Math.floor(Math.random()*t.length)],d:Date.now()-Math.random()*8e9})}
   X[g.slug]=e;save();draw();toast("3 avaliações simuladas")};
 };
 app.innerHTML=`<button class="back" id="bk">← Biblioteca</button><div class="dbg" style="background:radial-gradient(ellipse at 50% 0,hsl(${h} 70% 40%/.55),transparent 65%)">${im(g,["library_hero.jpg","header.jpg"],"","height:300px","hb")}</div>
 <div class="det"><div class="dg"><div>${cover(g)}<button class="play" id="pl">▶ JOGAR</button><div class="info"><div><span>Desenvolvedora</span><b>${esc(g.dev)}</b></div><div><span>Lançamento</span><b>${g.y}</b></div><div><span>Gênero</span><b>${g.g[0]}</b></div><div><span>Tempo jogado</span><b>${g.h}h</b></div><div><span>Preço</span><b>${brl(g.p)}</b></div></div></div>
 <div class="dt"><h1>${esc(g.n)}</h1><p>${g.d}</p><div class="shots"><div style="background:linear-gradient(160deg,hsl(${h} 60% 35%),hsl(${h} 40% 8%))">${im(g,["header.jpg"],"")}</div><div style="background:linear-gradient(20deg,hsl(${(h+40)%360} 50% 14%),hsl(${h} 65% 38%))">${im(g,["library_hero.jpg","header.jpg"],"")}</div></div>
 <div class="box" id="rb"></div><div id="rl"></div></div></div></div>`;
 document.getElementById("bk").onclick=()=>{location.hash="";};
 document.getElementById("pl").onclick=()=>toast("Iniciando "+g.n+"…");
 draw();scrollTo(0,0);
}
function route(){const s=location.hash.slice(1),g=L.find(x=>x.slug==s);g?detail(g):(lib(),scrollTo(0,0))}
addEventListener("hashchange",route);route();
</script>
